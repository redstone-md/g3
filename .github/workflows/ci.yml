name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Prisma client is generated to src/generated and is git-ignored.
      - run: npm run db:generate

      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

      # Build does not connect to the database (dynamic pages render on demand),
      # but the Prisma config needs a value to load.
      - run: npm run build
        env:
          DATABASE_URL: "mongodb://localhost:27017/ribbon"
